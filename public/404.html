<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikigai — page not found</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #ecfdf5;
      }
      a {
        color: #34d399;
      }
    </style>
    <script>
      // GitHub Pages SPA fallback: redirect to nested 404 or home with path preserved.
      ;(function () {
        var base = '/ikigai/'
        var path = location.pathname
        if (path.indexOf(base) === 0) {
          location.replace(base)
        }
      })()
    </script>
  </head>
  <body>
    <main>
      <h1>Not found</h1>
      <p><a href="/ikigai/">Return to Ikigai</a></p>
    </main>
  </body>
</html>
